[workspace]
members = ["crates/schematter", "crates/schematter-lib", "crates/schematter-validator"]
# schematter-wasm is a wasm-bindgen cdylib that does not link on native targets;
# keep it out of the default workspace build. Build it with its own build-wasm.sh.
exclude = ["crates/schematter-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
version = "0.1.0"
repository = "https://github.com/iwe-org/schematter"

[workspace.dependencies]
schematter-lib = { path = "crates/schematter-lib", version = "0.1.0" }
schematter-validator = { path = "crates/schematter-validator", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
regex = "1"
jsonschema = { version = "0.47", default-features = false }
pulldown-cmark = "0.13.3"
tiktoken-rs = "=0.12.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indoc = "2"
tempfile = "3.27"
