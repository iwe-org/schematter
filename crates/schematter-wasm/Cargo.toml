[package]
name = "schematter-wasm"
description = "WebAssembly bindings for schematter: validate a markdown document against a document schema in the browser."
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
repository = "https://github.com/iwe-org/schematter"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
schematter-lib = { path = "../schematter-lib" }
serde_json = "1"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
